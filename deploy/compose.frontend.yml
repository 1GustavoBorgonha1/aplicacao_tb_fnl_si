# EC2 PÚBLICA — frontend (Nginx). Recebe tráfego apenas do ALB.
#   cd /opt/marmifit && TAG=<sha> BACKEND_IP=10.0.2.10 docker compose -f compose.frontend.yml up -d
name: marmifit

services:
  frontend:
    image: ghcr.io/${GH_REPO:?defina GH_REPO, ex.: usuario/marmifit}/frontend:${TAG:-latest}
    restart: unless-stopped
    # O nginx.conf faz proxy para "backend:3000"; aqui o nome aponta para o IP privado da EC2 do backend.
    extra_hosts:
      - "backend:${BACKEND_IP:?defina BACKEND_IP (IP privado da EC2 do backend)}"
    ports:
      - "80:8080"              # aberta só para o SG do ALB
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
