# EC2 PRIVADA — backend (API). Banco no RDS e imagens no S3.
#   cd /opt/marmifit && TAG=<sha> docker compose -f compose.backend.yml up -d
name: marmifit

services:
  backend:
    image: ghcr.io/${GH_REPO:?defina GH_REPO, ex.: usuario/marmifit}/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_SSL: "true"     # TLS até o RDS
      STORAGE_DRIVER: s3       # credenciais via IAM Role da EC2
      TRUST_PROXY: "2"         # ALB + Nginx
    ports:
      - "3000:3000"            # aberta só para o SG da EC2 pública
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
