# Pipeline CI/CD da MarmiFit (constituição IV / Aula 7 — scanner de segurança no deploy).
# Segue o diagrama do trabalho (docs/arquitetura-aws.png):
#
#   test ──► sonarqube (Quality Gate) ──┐
#   audit (npm audit) ──────────────────┼─► build (docker build + push Docker Hub) ──► deploy (kubectl set image no K3s)
#   infra (terraform validate + k8s) ───┘
#
# Qualquer falha interrompe as etapas seguintes: código reprovado no SonarQube NÃO é publicado.
# Actions fixadas pelo SHA do commit (com a versão no comentário) — evita troca maliciosa da tag
# (supply chain). O Dependabot atualiza os SHAs.
#
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   secrets.SONAR_TOKEN / secrets.SONAR_HOST_URL   SonarQube Cloud
#   vars.SONAR_ORGANIZATION                         chave da organização no SonarQube Cloud
#   secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN    push das imagens (token Read & Write)
#   vars.DEPLOY_ENABLED = "true"                    liga o deploy quando a AWS existir
#   vars.AWS_REGION, vars.AWS_DEPLOY_ROLE_ARN       role assumida via OIDC (sem access key)
#   vars.K3S_MASTER_INSTANCE_ID                     EC2 do master (recebe o comando via SSM)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilégio para o GITHUB_TOKEN; cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_BACKEND: gustavoborgonha/marmifit-backend
  IMAGE_FRONTEND: gustavoborgonha/marmifit-frontend

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marmifit_test
          POSTGRES_USER: marmifit
          # Banco descartável, só acessível dentro do runner e apagado ao fim do job:
          # sem senha nenhuma no código (nada a vazar).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marmifit" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://marmifit@localhost:5432/marmifit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --ignore-scripts: nenhum script de instalação de dependência roda no CI (supply chain).
      - name: Backend — instalar
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Backend — lint
        working-directory: backend
        run: npm run lint

      - name: Backend — testes com cobertura
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend — build
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build

      - name: Publicar cobertura para o SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Falha se houver vulnerabilidade ALTA ou CRÍTICA em dependências de produção.
      - name: npm audit — backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infra (Terraform + Kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Kubernetes — renderizar os overlays
        run: |
          for f in backend db; do cp "k8s/overlays/local/$f.local.env.example" "k8s/overlays/local/$f.local.env"; done
          kubectl kustomize k8s/overlays/aws > /dev/null
          kubectl kustomize k8s/overlays/local > /dev/null
          echo "Manifests válidos"

      - name: Terraform existe?
        id: tf
        run: |
          if [ -d infra/terraform ] && ls infra/terraform/*.tf > /dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/terraform ainda não existe — validação do Terraform pulada."
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.tf.outputs.existe == 'true'

      - name: Terraform — fmt e validate
        if: steps.tf.outputs.existe == 'true'
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  sonarqube:
    name: SonarQube (SAST + Quality Gate)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo melhora a análise de código novo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: backend/coverage

      - name: Verificar configuração
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::Configure os secrets SONAR_TOKEN e SONAR_HOST_URL (veja README → SonarQube)."
            exit 1
          fi

      # qualitygate.wait=true faz o job FALHAR se o Quality Gate for reprovado → bloqueia build/deploy.
      - name: Análise SonarQube
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  build:
    name: Docker build + push (Docker Hub)
    needs: [sonarqube, audit, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Em PR só compila (prova que a imagem builda); push apenas na main.
      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy no K3s (AWS)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Environment "production" permite exigir aprovação manual (Settings → Environments).
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: troca o token do GitHub por credenciais temporárias da AWS
    steps:
      - name: Credenciais AWS temporárias (OIDC, sem access key)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # O master está na subnet privada: o comando chega via SSM (sem SSH, sem porta aberta).
      - name: kubectl set image (rollout) via SSM
        env:
          INSTANCE_ID: ${{ vars.K3S_MASTER_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT="k3s kubectl -n marmifit set image deployment/backend backend=${IMAGE_BACKEND}:${TAG} && \
          k3s kubectl -n marmifit set image deployment/frontend frontend=${IMAGE_FRONTEND}:${TAG} && \
          k3s kubectl -n marmifit rollout status deployment/backend --timeout=180s && \
          k3s kubectl -n marmifit rollout status deployment/frontend --timeout=180s"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "MarmiFit deploy ${TAG}" \
            --parameters "commands=[\"$SCRIPT\"]" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $CMD_ID"
          # Espera até 8 min (o rollout dos dois deployments pode levar alguns minutos).
          for i in $(seq 1 48); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,saida:StandardOutputContent,erro:StandardErrorContent}' --output json
          [ "$STATUS" = "Success" ] || { echo "::error::Deploy falhou no cluster ($STATUS)"; exit 1; }
