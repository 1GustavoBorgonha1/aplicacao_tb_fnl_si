# Nginx do frontend MarmiFit (ADR-02 / docs/seguranca/hardening.md)
# - serve o build estático do React
# - proxy reverso de /api e /uploads para o backend (mesma origem, sem CORS)
# - headers de segurança e rate limiting (equivalente ao mod_qos da Aula 4)

# Rate limit por IP: 10 req/s na API e 2 req/s no login (com rajada de 10 — uso humano não é barrado;
# a contagem de senhas erradas fica no backend: 10 falhas / 15 min).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
limit_req_status 429;

# IP real do cliente atrás do ALB (AWS) — sem isso o rate limit veria só o IP do balanceador.
# Confia no X-Forwarded-For apenas quando vem de redes privadas (ALB/Docker).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Não revela a versão do Nginx (Security Misconfiguration).
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 3m;     # upload de imagem (2 MB) + campos
    client_body_timeout 10s;     # mitiga Slowloris / Slow HTTP (Aula 4)
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ---- Headers de segurança ----
    include /etc/nginx/conf.d/security-headers.inc;

    # Bloqueia arquivos ocultos (.git, .env...)
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /uploads/ {
        include /etc/nginx/conf.d/proxy.inc;
        expires 1d;
    }

    # Assets com hash no nome → cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html (React Router).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
