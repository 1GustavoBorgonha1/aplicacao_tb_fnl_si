# Testes de integração do backend contra um Postgres descartável.
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v

name: marmifit-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marmifit_test
      POSTGRES_USER: marmifit
      POSTGRES_PASSWORD: marmifit
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marmifit -d marmifit_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3 compatível para testar o driver S3 com o mesmo código da AWS.
  s3-test:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: marmifit-teste
    read_only: true
    tmpfs: [/tmp]

  tests:
    build:
      context: ./backend
      target: test
    depends_on:
      db-test:
        condition: service_healthy
      s3-test:
        condition: service_started
    environment:
      DATABASE_URL: postgres://marmifit:marmifit@db-test:5432/marmifit_test
      S3_TEST_ENDPOINT: http://s3-test:9090
