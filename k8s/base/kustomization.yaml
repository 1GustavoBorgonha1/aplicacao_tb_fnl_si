# Base comum dos manifests da MarmiFit (ADR-13). Use sempre um overlay:
#   kubectl apply -k k8s/overlays/local   # Kubernetes do Docker Desktop
#   kubectl apply -k k8s/overlays/aws     # cluster K3s na AWS
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marmifit
labels:
  - pairs:
      app.kubernetes.io/part-of: marmifit
resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
