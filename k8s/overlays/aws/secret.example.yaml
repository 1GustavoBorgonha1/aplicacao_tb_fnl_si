# MODELO — não aplique este arquivo com valores reais e nunca commite segredos.
# Prefira criar com `kubectl create secret generic` (ver kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: marmifit
type: Opaque
stringData:
  DATABASE_URL: postgres://USUARIO:SENHA@ENDPOINT-DO-RDS:5432/marmifit
  JWT_SECRET: gere-com-openssl-rand-base64-48 # mínimo 32 caracteres
  ADMIN_EMAIL: admin@exemplo.com
  ADMIN_PASSWORD: troque-no-primeiro-acesso-pela-tela-minha-conta
