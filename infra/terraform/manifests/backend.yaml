# API Node/Express. Só é acessível dentro do cluster (ClusterIP) e só pelo frontend (NetworkPolicy).
# Configuração: ConfigMap "backend-config" (overlay) + Secret "backend-secret" (criado fora do Git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # rollout sem indisponibilidade
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false # a API não fala com o Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # usuário "node" da imagem
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints: # espalha as réplicas pelos workers (alta disponibilidade)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: backend } }
      containers:
        - name: backend
          image: marmifit-backend # Registro e tag definidos pelo Terraform.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret } # DATABASE_URL, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
          env:
            - { name: NODE_ENV, value: production }
          # Readiness consulta o banco: pod sem banco sai do balanceamento.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Liveness NÃO depende do banco (uma falha do RDS não deve reiniciar todos os pods).
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 24 # até 2 min para migrations no primeiro start
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# O nome "backend" é o host usado pelo Nginx (frontend/proxy.inc → proxy_pass http://backend:3000).
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - { name: http, port: 3000, targetPort: http }
