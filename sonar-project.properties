# SonarQube — análise estática (SAST), qualidade e cobertura (ADR-06).
# No SonarQube Cloud, defina também sonar.organization (ou passe via -D no CI).
sonar.projectKey=1GustavoBorgonha1_aplicacao_tb_fnl_si
sonar.projectName=MarmiFit
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Cobertura exigida apenas para o backend (o frontend não tem testes unitários).
sonar.coverage.exclusions=frontend/**,backend/tests/**,backend/src/server.js,backend/src/storage/s3.js

# Analisa também Dockerfiles e docker-compose (regras de segurança de infraestrutura).
sonar.docker.file.patterns=Dockerfile
