# SonarQube — análise estática (SAST), qualidade e cobertura (ADR-06).
# No SonarQube Cloud, defina também sonar.organization (ou passe via -D no CI).
sonar.projectKey=1GustavoBorgonha1_aplicacao_tb_fnl_si
sonar.projectName=MarmiFit
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,k8s
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.js,frontend/tests/**/*.js,frontend/tests/**/*.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.local.env*
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Backend e frontend têm testes; ficam fora só pontos de entrada e o driver S3 (testado na AWS).
sonar.coverage.exclusions=frontend/src/main.jsx,frontend/tests/**,backend/tests/**,backend/src/server.js,backend/src/storage/s3.js

# Analisa também Dockerfiles e docker-compose (regras de segurança de infraestrutura).
sonar.docker.file.patterns=Dockerfile
